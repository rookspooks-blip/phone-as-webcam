name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release with this tag (e.g. v0.1.0); empty = just build"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  desktop-windows:
    name: Windows desktop (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Release build
        working-directory: desktop
        run: cargo build --release -p lensbridge -p lb-sim
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            desktop/target/release/lensbridge.exe
            desktop/target/release/lb-sim.exe

  desktop-macos:
    name: macOS desktop (universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build both architectures
        working-directory: desktop
        run: |
          cargo build --release -p lensbridge --target aarch64-apple-darwin
          cargo build --release -p lensbridge --target x86_64-apple-darwin
      - name: Universal .app in a .dmg
        run: |
          set -e
          APP=dist/Lensbridge.app
          mkdir -p $APP/Contents/MacOS
          lipo -create -output $APP/Contents/MacOS/lensbridge \
            desktop/target/aarch64-apple-darwin/release/lensbridge desktop/target/x86_64-apple-darwin/release/lensbridge
          cp packaging/macos/Info.plist $APP/Contents/Info.plist
          codesign --force --deep -s - $APP   # ad-hoc signature (no Developer ID)
          lipo -info $APP/Contents/MacOS/lensbridge
          hdiutil create -volname Lensbridge -srcfolder dist -ov -format UDZO Lensbridge-macos-universal.dmg
          shasum -a 256 Lensbridge-macos-universal.dmg > Lensbridge-macos-universal.dmg.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Lensbridge-macos-universal
          path: Lensbridge-macos-universal.dmg*

  desktop-linux:
    name: Linux desktop (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build
        working-directory: desktop
        run: cargo build --release -p lensbridge -p lb-sim
      - name: Package
        run: |
          D=Lensbridge-linux-x64
          mkdir -p $D
          cp desktop/target/release/lensbridge desktop/target/release/lb-sim README.md $D/
          tar czf $D.tar.gz $D
          sha256sum $D.tar.gz > $D.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Lensbridge-linux-x64
          path: Lensbridge-linux-x64.tar.gz*

  vcam-filter:
    name: DirectShow filter (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            out: lensbridge_vcam.dll
          - arch: Win32
            out: lensbridge_vcam_x86.dll
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S drivers/windows/dshow-filter -B build -A ${{ matrix.arch }}
      - name: Build
        run: cmake --build build --config Release
      - name: Rename
        shell: bash
        run: mkdir -p out && cp build/Release/lensbridge_vcam.dll out/${{ matrix.out }}
      - uses: actions/upload-artifact@v4
        with:
          name: vcam-${{ matrix.arch }}
          path: out/${{ matrix.out }}

  package-windows:
    name: Windows package
    needs: [desktop-windows, vcam-filter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Assemble zip
        run: |
          set -e
          D=Lensbridge-windows-x64
          mkdir -p $D/vcam
          cp art/desktop-windows-x64/lensbridge.exe art/desktop-windows-x64/lb-sim.exe $D/
          cp art/vcam-x64/lensbridge_vcam.dll art/vcam-Win32/lensbridge_vcam_x86.dll $D/vcam/
          cp packaging/windows/*.cmd $D/
          cp README.md $D/README.md
          cp README.ru.md $D/README.ru.md 2>/dev/null || true
          zip -r $D.zip $D
          sha256sum $D.zip > $D.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Lensbridge-windows-x64
          path: Lensbridge-windows-x64.zip*

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Release keystore (optional, from repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.LB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LB_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No LB_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key"
          fi
      - name: Unit tests + release APK
        env:
          LB_KEYSTORE_PASSWORD: ${{ secrets.LB_KEYSTORE_PASSWORD }}
          LB_KEY_ALIAS: ${{ secrets.LB_KEY_ALIAS }}
          LB_KEY_PASSWORD: ${{ secrets.LB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Lensbridge-android.apk
          sha256sum Lensbridge-android.apk > Lensbridge-android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Lensbridge-android
          path: mobile/android/Lensbridge-android.apk*

  ios:
    name: iOS app
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Generate project
        run: brew install xcodegen && xcodegen
      - name: Unit tests (simulator)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test -project Lensbridge.xcodeproj -scheme Lensbridge -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO | tail -40
          exit ${PIPESTATUS[0]}
      - name: Build unsigned device app
        run: |
          xcodebuild build -project Lensbridge.xcodeproj -scheme Lensbridge -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -40
          exit ${PIPESTATUS[0]}
      - name: Package .ipa (unsigned, for AltStore / SideStore / Sideloadly)
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Lensbridge.app Payload/
          zip -qr Lensbridge-unsigned.ipa Payload
          shasum -a 256 Lensbridge-unsigned.ipa > Lensbridge-unsigned.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Lensbridge-ios-unsigned
          path: mobile/ios/Lensbridge-unsigned.ipa*

  release:
    name: GitHub Release
    # macOS runners are sometimes unavailable: publish the rest rather than nothing.
    if: >-
      !cancelled() &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) &&
      needs.package-windows.result == 'success' && needs.android.result == 'success' &&
      needs.ios.result == 'success' && needs.desktop-linux.result == 'success'
    needs: [package-windows, desktop-macos, desktop-linux, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Collect files and checksums
        run: |
          mkdir -p out
          find art -type f \( -name 'Lensbridge-*' ! -name '*.sha256' \) -exec cp {} out/ \;
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Lensbridge ${{ inputs.release_tag || github.ref_name }}
          files: out/*
          generate_release_notes: true
          prerelease: true
          body: |
            Первая сборка. Собрана и протестирована в CI, но **ещё не проверена на реальных телефонах** — см. docs/TESTING.md.
            Инструкция: docs/GUIDE.ru.md. Контрольные суммы: SHA256SUMS.
