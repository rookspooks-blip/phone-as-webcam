[package]
name = "lensbridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lb-client = { path = "../../crates/lb-client", features = ["audio"] }
crossbeam-channel = "0.5.17"
eframe = { version = "0.36.2", features = ["glow"] }
env_logger = "0.11.11"
lb-proto = { version = "0.1.0", path = "../../crates/lb-proto" }
log = "0.4.34"
mdns-sd = "0.21.5"
qrcode = "0.14.1"

serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
dirs = "7.0.0"
base64 = "0.23.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
